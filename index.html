<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GABE VIRNIG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Cool Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f7fa;
      font-family: 'Montserrat', sans-serif;
      color: #111;
    }

    .wrapper {
      text-align: center;
    }

    h1 {
      font-size: clamp(3rem, 6vw, 5rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 250ms ease, transform 150ms ease;
    }

    button {
      margin-top: 2rem;
      padding: 0.8rem 2.2rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      border: none;
      border-radius: 999px;
      background: #111;
      color: #fff;
      transition: transform 140ms ease, filter 140ms ease;
    }

    button:hover {
      transform: scale(1.05);
      filter: brightness(1.1);
    }

    button:active {
      transform: scale(0.97);
      filter: brightness(0.9);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1 id="name">GABE VIRNIG</h1>
    <button id="colorButton">Click Me</button>
  </div>

  <script>
    function randomColor() {
      const hue = Math.floor(Math.random() * 360);
      return `hsl(${hue} 70% 45%)`;
    }

    const nameEl = document.getElementById("name");
    const buttonEl = document.getElementById("colorButton");

    buttonEl.addEventListener("click", () => {
      nameEl.style.color = randomColor();
      nameEl.style.transform = "scale(1.03)";
      setTimeout(() => nameEl.style.transform = "scale(1)", 150);
    });
  </script>
</body>
</html>

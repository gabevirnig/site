<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GABE VIRNIG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f7fa;
      font-family: 'Montserrat', sans-serif;
      color: #111;
    }

    .card {
      position: relative;
      background: #ffffff;
      border-radius: 18px;
      border: 1px solid #e5e7eb;
      padding: 4rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.04);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 18px;
      padding: 2px;
      background:
        radial-gradient(
          circle at var(--bg-x, 50%) var(--bg-y, 50%),
          rgba(153,153,153,0.8),
          rgba(153,153,153,0.6) 10%,
          rgba(153,153,153,0.4) 20%,
          transparent 70%
        );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    h1 {
      font-size: clamp(3rem, 6vw, 5rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 250ms ease, transform 120ms ease-out;
    }

    h1.bump { transform: scale(1.03); }

    button {
      margin-top: 2rem;
      margin-bottom: 0.8rem;
      padding: 0.8rem 2.2rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      border: none;
      border-radius: 999px;
      background: #111;
      color: #fff;
      transition: transform 140ms ease, filter 140ms ease;
    }

    button:hover {
      transform: scale(1.05);
      filter: brightness(1.1);
    }

    button:active {
      transform: scale(0.97);
      filter: brightness(0.9);
    }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.6rem; margin: 0 1rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="name">GABE VIRNIG</h1>
    <button id="colorButton">Click</button>
  </div>

  <script>
    function randomColor() {
      const hue = Math.floor(Math.random() * 360);
      return `hsl(${hue} 70% 45%)`;
    }

    const nameEl = document.getElementById("name");
    const buttonEl = document.getElementById("colorButton");
    const cardEl = document.querySelector(".card");

    buttonEl.addEventListener("click", () => {
      nameEl.style.color = randomColor();
      nameEl.classList.add("bump");
      setTimeout(() => nameEl.classList.remove("bump"), 150);
    });

    let targetX = 50, targetY = 50;
    let currentX = 50, currentY = 50;

    document.addEventListener('mousemove', (e) => {
      const rect = cardEl.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      targetX = Math.max(0, Math.min(100, x));
      targetY = Math.max(0, Math.min(100, y));
    });

    function animateGlow() {
      const ease = 0.08; // lower = smoother/slower
      currentX += (targetX - currentX) * ease;
      currentY += (targetY - currentY) * ease;
      cardEl.style.setProperty('--bg-x', `${currentX}%`);
      cardEl.style.setProperty('--bg-y', `${currentY}%`);
      requestAnimationFrame(animateGlow);
    }

    animateGlow();

    document.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      const x = e.clientX / innerWidth;
      const y = e.clientY / innerHeight;
      const angle = Math.atan2(y - 0.5, x - 0.5);
      const percent = (angle + Math.PI) / (2 * Math.PI);
      document.querySelector('.card').style.setProperty('--pos', percent);
      const border = document.querySelector('.card::before');
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gabe Virnig</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1f2933, #020617);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      color: #e5e7eb;
    }

    .card {
      padding: 3rem 3.5rem;
      border-radius: 1.5rem;
      background: rgba(15, 23, 42, 0.9);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(148, 163, 184, 0.12);
      text-align: center;
      backdrop-filter: blur(14px);
    }

    .accent-ring {
      position: relative;
      display: inline-flex;
      padding: 0.1rem;
      border-radius: 999px;
      background: conic-gradient(
        from 180deg,
        #22d3ee,
        #a855f7,
        #f97316,
        #22c55e,
        #22d3ee
      );
    }

    .name {
      padding: 0.3rem 1.75rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.96);
      font-size: clamp(2.25rem, 4vw, 3.25rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      transition: color 220ms ease-out, transform 150ms ease-out;
      will-change: color, transform;
    }

    .subtitle {
      margin-top: 0.8rem;
      font-size: 0.95rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .actions {
      margin-top: 2.3rem;
    }

    button {
      border: none;
      outline: none;
      cursor: pointer;
      padding: 0.9rem 2.4rem;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #22c55e, #22d3ee);
      color: #020617;
      box-shadow:
        0 12px 30px rgba(34, 197, 94, 0.35),
        0 0 0 1px rgba(15, 23, 42, 0.85);
      transition:
        transform 140ms ease-out,
        box-shadow 140ms ease-out,
        filter 140ms ease-out;
    }

    button:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow:
        0 16px 40px rgba(34, 197, 94, 0.45),
        0 0 0 1px rgba(15, 23, 42, 0.85);
      filter: brightness(1.05);
    }

    button:active {
      transform: translateY(0) scale(0.99);
      box-shadow:
        0 8px 22px rgba(15, 23, 42, 0.9),
        0 0 0 1px rgba(15, 23, 42, 0.9);
      filter: brightness(0.98);
    }

    .hint {
      margin-top: 1.2rem;
      font-size: 0.8rem;
      color: #6b7280;
    }

    @media (max-width: 480px) {
      .card {
        padding: 2.2rem 1.7rem;
        margin: 0 1rem;
      }

      .subtitle {
        font-size: 0.8rem;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="accent-ring">
      <h1 id="name" class="name">Gabe Virnig</h1>
    </div>
    <p class="subtitle">Personal Homepage</p>

    <div class="actions">
      <button id="colorButton">Click Me</button>
      <p class="hint">Each click gives your name a new color.</p>
    </div>
  </div>

  <script>
    function getRandomColor() {
      // Use HSL for nice saturated colors
      const hue = Math.floor(Math.random() * 360); // 0–359
      const saturation = 70 + Math.floor(Math.random() * 20); // 70–89%
      const lightness = 55 + Math.floor(Math.random() * 10); // 55–64%
      return `hsl(${hue} ${saturation}% ${lightness}%)`;
    }

    const nameEl = document.getElementById("name");
    const buttonEl = document.getElementById("colorButton");

    buttonEl.addEventListener("click", () => {
      nameEl.style.color = getRandomColor();
      nameEl.style.transform = "scale(1.02)";
      // quick micro-bounce back
      setTimeout(() => {
        nameEl.style.transform = "scale(1)";
      }, 150);
    });
  </script>
</body>
</html>
